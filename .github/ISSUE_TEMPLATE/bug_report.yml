name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a **security vulnerability** (e.g. an authentication
        bypass, a way to read another user's encrypted name, or anything
        else with a security or privacy impact), please do not file it here.
        Report it privately instead, following [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue reliably.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        PHP version, database (SQLite or MySQL/MariaDB), browser and OS if
        the bug is frontend-related, and how you're running Coffee Time
        (e.g. local dev server, your own deployment).
    validations:
      required: false
