name: Publish container image

# Builds the runtime image once and pushes that same manifest to both the
# GitHub Container Registry and Docker Hub. Like deploy.yml this is
# workflow_call-only plus a manual trigger, so the image is only ever
# published behind ci.yml's test gate -- an image tagged "latest" that never
# ran the suite is worse than no image at all.
#
# Registries:
#   ghcr.io/<owner>/<repo>           always
#   docker.io/marcomattes/coffetime  only when both Docker Hub secrets exist
#
# Tags produced (docker/metadata-action):
#   push to main      -> edge, sha-<short>
#   tag v1.2.3        -> 1.2.3, 1.2, 1, latest, sha-<short>
# The semver comes from the git tag; src/build.json inside the image carries
# the commit, because Version::shorten() only accepts a hex sha.
#
# ghcr.io needs no secrets: GITHUB_TOKEN can write to it for this repo given
# the packages:write permission below. Docker Hub needs two repository
# secrets, and the push there is skipped -- not failed -- when they are
# missing, so a fork still gets its ghcr.io image without any setup:
#   DOCKERHUB_USERNAME  Docker Hub account name
#   DOCKERHUB_TOKEN     access token from hub.docker.com -> Account settings
#                       -> Personal access tokens. Not the account password.
#                       Scope must be Read/Write/Delete, not Read & Write:
#                       the overview sync below writes through the Hub API,
#                       which the narrower scope is not allowed to call.
# The Docker Hub repository itself is created by the first push, private by
# default. It has to be switched to public on the Hub for the unauthenticated
# pull commands in the README to work; nothing in this file can set that.
#
# The ghcr.io package inherited this repository's public visibility on first
# push, so the pull commands in README.md work unauthenticated. If that ever
# changes, it is fixed under Packages -> coffetime -> Package settings ->
# Change visibility; nothing in this file can set it.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub has no owner/repo to derive this from, so it is spelled out.
  DOCKERHUB_IMAGE: marcomattes/coffetime

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by attest-build-provenance to sign the attestation.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # linux/arm64 is emulated through QEMU here. It roughly triples the job
      # for that architecture because pdo_sqlite is compiled from source, but
      # a self-hosted coffee tracker is exactly the kind of thing that ends up
      # on a Raspberry Pi or an ARM VPS, so it is worth the wall clock.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything Docker Hub touches hangs off this one flag, so a repository
      # without the secrets -- a fork, or this one before they were added --
      # publishes to ghcr.io and says why it stopped there.
      - name: Check for Docker Hub credentials
        id: hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set; publishing to ghcr.io only.'
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.hub.outputs.enabled }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Coffee Time
            org.opencontainers.image.description=Self-hosted coffee tab tracker with passkey sign-in
            org.opencontainers.image.licenses=MIT

      - name: Build timestamp
        id: stamp
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_AT=${{ steps.stamp.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # One attestation per registry: the digest is identical (it is the same
      # manifest list) but the subject name is part of what gets signed, so
      # `gh attestation verify` on a docker.io reference needs its own.
      - name: Attest build provenance (ghcr.io)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        if: steps.hub.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Without this the Hub page reads "No overview available". README.md is
      # not the source: it is written for GitHub, sits a few hundred bytes
      # under the Hub's 25,000-byte ceiling, and most of it (tests, FTP
      # deployment, contributing) is noise to someone deciding whether to pull
      # an image. docs/docker-hub.md is the same project described for that
      # reader, with absolute links because relative ones do not resolve here.
      - name: Sync the Docker Hub overview
        if: steps.hub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Self-hosted coffee tab tracker with passkey sign-in
          readme-filepath: ./docs/docker-hub.md

      - name: Summary
        run: |
          {
            printf '### Published image\n\n'
            printf '```\n%s\n```\n\n' '${{ steps.meta.outputs.tags }}'
            printf 'Digest: `%s`\n\n' '${{ steps.build.outputs.digest }}'
            printf 'Built from commit `%s`.\n\n' '${{ github.sha }}'
            if [ '${{ steps.hub.outputs.enabled }}' != 'true' ]; then
              printf 'Docker Hub was skipped: `DOCKERHUB_USERNAME`/`DOCKERHUB_TOKEN` are not configured.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
