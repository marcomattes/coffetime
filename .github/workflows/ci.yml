name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate dependency metadata
        run: composer validate --strict --no-check-publish

      - name: Run test suite
        run: php tests/run.php

      - name: Check PHP syntax
        run: find public src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript frontend
        run: npm run build

      - name: TypeScript build matches committed output
        run: git diff --exit-code -- public/app.js public/sw.js

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: coffee-root-pass
          MYSQL_DATABASE: coffee_test
          MYSQL_USER: coffee
          MYSQL_PASSWORD: coffee-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # tests/helpers.php drops and recreates the configured database before
      # each test phase, which the MYSQL_USER above is not granted rights to
      # do. The mariadb service image only lets us provision that user with
      # its own database up front, not extra privileges, so the simplest
      # setup that actually satisfies the drop/create contract is running the
      # suite as root (which always has DROP/CREATE) against the same
      # service; MYSQL_DATABASE/MYSQL_USER above still make sure the "coffee"
      # user/database combination works for anyone using it outside CI.
      - name: Run test suite against MySQL/MariaDB
        env:
          COFFEE_TEST_DB: '{"driver":"mysql","host":"127.0.0.1","port":3306,"database":"coffee_test","user":"root","password":"coffee-root-pass"}'
        run: php tests/run.php

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npm run e2e:install

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Uploads line coverage (and the analysis itself) to SonarQube Cloud. The
  # scan is deliberately not part of the `build` gate: a Sonar outage or an
  # expired token should not be able to hold up a release.
  sonarqube:
    runs-on: ubuntu-latest
    # SONAR_TOKEN is not exposed to workflows triggered from a fork, where the
    # scan could only fail.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sonar reads the git history to attribute issues and to decide what
          # counts as new code; a shallow clone leaves both blank.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite
          # The only job that needs it: tests/coverage.php collects through
          # Xdebug, and `coverage: none` everywhere else keeps the other jobs
          # running at full speed.
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite with coverage
        run: php tests/run.php --coverage

      # The scanner copies SONAR_TOKEN straight into an Authorization header,
      # so a secret stored with a trailing newline takes the whole analysis
      # down with "Unexpected char 0x0a in Authorization value" before it
      # reaches the server. Normalising here means the secret does not have to
      # have been pasted byte-perfect, and an unset one fails with a sentence
      # instead of a scanner stack trace.
      - name: Normalise the SonarQube token
        env:
          RAW_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_SONAR_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo 'SONAR_TOKEN is empty or unset. Add it as a repository secret.' >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run static analysis
        run: composer analyse

  build:
    needs: [test, test-mysql, test-e2e, phpstan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Assemble production release
        run: ./scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: coffee-time-release
          path: deploy/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Same gate as the FTP deploy: only ever publish an image that the suite
  # above went green on. Tag pushes publish too (that is where the semver
  # tags come from) but deliberately do not reach the deploy job, so cutting
  # a release does not re-upload the FTP target as a side effect.
  publish-image:
    needs: build
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    # Passes the Docker Hub credentials through; without this the called
    # workflow sees empty secrets and silently publishes to ghcr.io only.
    secrets: inherit
