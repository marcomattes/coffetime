name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate dependency metadata
        run: composer validate --strict --no-check-publish

      - name: Run test suite
        run: php tests/run.php

      - name: Check PHP syntax
        run: find public src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript frontend
        run: npm run build

      - name: TypeScript build matches committed output
        run: git diff --exit-code -- public/app.js public/sw.js

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: coffee-root-pass
          MYSQL_DATABASE: coffee_test
          MYSQL_USER: coffee
          MYSQL_PASSWORD: coffee-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # tests/helpers.php drops and recreates the configured database before
      # each test phase, which the MYSQL_USER above is not granted rights to
      # do. The mariadb service image only lets us provision that user with
      # its own database up front, not extra privileges, so the simplest
      # setup that actually satisfies the drop/create contract is running the
      # suite as root (which always has DROP/CREATE) against the same
      # service; MYSQL_DATABASE/MYSQL_USER above still make sure the "coffee"
      # user/database combination works for anyone using it outside CI.
      - name: Run test suite against MySQL/MariaDB
        env:
          COFFEE_TEST_DB: '{"driver":"mysql","host":"127.0.0.1","port":3306,"database":"coffee_test","user":"root","password":"coffee-root-pass"}'
        run: php tests/run.php

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run static analysis
        run: composer analyse

  build:
    needs: [test, test-mysql, test-e2e, phpstan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Assemble production release
        run: ./scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: coffee-time-release
          path: deploy/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
