# SonarQube Cloud analysis, run from the "sonarqube" job in
# .github/workflows/ci.yml. CI-based analysis and the Automatic Analysis in
# the project settings are mutually exclusive: Automatic Analysis has to be
# switched off for this file to take effect, and it cannot report coverage.
sonar.projectKey=marcomattes_coffetime
sonar.organization=marcomattes
sonar.sourceEncoding=UTF-8

# frontend/ holds the TypeScript sources; public/app.js and public/sw.js are
# their committed tsc output and are excluded below.
sonar.sources=src,public,frontend,scripts,tools
sonar.tests=tests,e2e

# public/app.js and public/sw.js are generated: they are the same code as
# frontend/app.ts and frontend/sw.ts, so analysing both reports every line of
# the frontend as duplicated and every issue in it twice. The remaining
# entries are binaries, dependencies and build output.
sonar.exclusions=public/app.js,public/sw.js,public/icons/**,public/screenshots/**,vendor/**,node_modules/**,deploy/**,coverage/**

# Written by `php tests/run.php --coverage`; see tests/coverage.php.
sonar.php.coverage.reportPaths=coverage/clover.xml
