services:
  app:
    # Builds from this checkout. To run a published image instead, comment the
    # build line out and use the image line below -- the tags are documented in
    # README.md ("Run the published image").
    build: .
    # image: ghcr.io/marcomattes/coffetime:latest
    ports:
      - "8123:80"
    volumes:
      - coffee-data:/var/www/html/data
      # The setup wizard runs out of the box; rpId/origin are derived from
      # the request. For a fixed configuration, bind-mount your own:
      # - ./config.php:/var/www/html/config.php:ro
    restart: unless-stopped

volumes:
  coffee-data:
